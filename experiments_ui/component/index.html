<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experiments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Tokens ─────────────────────────────────────────────────────────────
   Three modes mirror the dash's theme.py (Light / Sepia / Dark). The dash
   passes its mode in; the standalone preview accepts #theme=. Status colours
   are text-safe pairs (AA on their own tint), not the raw brand fills. */
:root{
  --g900:#0A3D24; --g800:#0D5C3A; --g700:#0F7348; --g500:#00A368; --g300:#52D19A; --g200:#A8EAC8; --g100:#D4F5E4; --g50:#EDF9F3;
  --bg:#FAF8F4; --surface:#FFFFFF; --surface-2:#F6F4EF; --line:#E8EAEE; --line-2:#CDD0D8;
  --ink:#18191A; --ink-2:#2E3035; --ink-3:#52555C; --ink-4:#6E7179; --ink-5:#A8ABB3;
  --track:#EEEDE8;
  --win-fill:#00A368; --win-ink:#0D5C3A; --win-tint:#EDF9F3; --win-line:#A8EAC8;
  --warn-fill:#D97706; --warn-ink:#8A4B08; --warn-tint:#FEF6E0; --warn-line:#F5D99A;
  --bad-fill:#C53030; --bad-ink:#9B2C2C; --bad-tint:#FEE2E2; --bad-line:#F5B5B5;
  --neutral-tint:#F1F2F4; --neutral-ink:#52555C;
  --brand:#0F7348; --focus:#00A368;
  --sh1:0 1px 2px rgba(16,24,20,.05),0 1px 3px rgba(16,24,20,.04);
  --sh2:0 12px 40px rgba(16,24,20,.16),0 2px 8px rgba(16,24,20,.06);
  --scrim:rgba(12,14,12,.32);
  --r6:6px; --r8:8px; --r12:12px; --r16:16px;
  --font-d:"Lora",Georgia,serif; --font-u:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-theme="sepia"]{
  --bg:#F7F1E3; --surface:#FDF9F0; --surface-2:#F3EBDA; --line:#E6DAC2; --line-2:#D5C6A8;
  --ink:#33291C; --ink-2:#3F3424; --ink-3:#6B5D49; --ink-4:#76684F; --ink-5:#B3A58E;
  --track:#ECE2CD; --neutral-tint:#EFE7D5; --neutral-ink:#6B5D49; --brand:#1B6B45;
  --win-tint:#E8F3E6; --warn-tint:#FBEFD2;
}
:root[data-theme="dark"]{
  --bg:#15181C; --surface:#1E2228; --surface-2:#232830; --line:#2F353E; --line-2:#3C434E;
  --ink:#E8EAEE; --ink-2:#D5D8DE; --ink-3:#A8ABB3; --ink-4:#8B8F98; --ink-5:#6B707A;
  --track:#2B313A; --neutral-tint:#2A3039; --neutral-ink:#C3C7CE; --brand:#2FA96B; --focus:#52D19A;
  --win-fill:#2FBF7E; --win-ink:#7FE0B0; --win-tint:#143024; --win-line:#1F5A3E;
  --warn-fill:#E59A2F; --warn-ink:#F2C47A; --warn-tint:#33270F; --warn-line:#5E4718;
  --bad-fill:#E05252; --bad-ink:#F4A3A3; --bad-tint:#3A1A1A; --bad-line:#6B2C2C;
  --sh1:0 1px 2px rgba(0,0,0,.3); --sh2:0 16px 48px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-u);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.num,.tab-n{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:1180px;margin:0 auto;padding:24px 28px 64px}
@media (max-width:900px){.wrap{padding:16px 16px 48px}}

/* header */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.hdr h1{font-family:var(--font-d);font-weight:600;font-size:26px;letter-spacing:-.01em;margin:0;line-height:1.2}
.hdr .meta{color:var(--ink-3);font-size:13px;margin-top:4px}
.badge-fixture{font-size:12px;font-weight:500;color:var(--warn-ink);border:1px dashed var(--warn-line);background:var(--warn-tint);padding:3px 10px;border-radius:999px;white-space:nowrap}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r8);font-size:13px;margin:14px 0 0;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.banner.warn{background:var(--warn-tint);border-color:var(--warn-line);color:var(--warn-ink)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 24px;overflow-x:auto;position:relative}
.sr{left:0;top:0}
.tab{appearance:none;background:none;border:0;padding:10px 12px 11px;font-size:14px;font-weight:500;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.tab-n{font-size:12px;color:var(--ink-3);background:var(--neutral-tint);padding:0 7px;border-radius:999px;line-height:18px}
.tab .dot{width:6px;height:6px;border-radius:50%;background:var(--warn-fill)}

/* section titles */
.sec{margin:0 0 32px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 10px}
.sec-h h2{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0}
.sec-h .aside{font-size:13px;color:var(--ink-3)}
.linkbtn{appearance:none;background:none;border:0;padding:0;color:var(--brand);font-weight:500;font-size:13px;cursor:pointer}
.linkbtn:hover{text-decoration:underline}

/* today strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:32px}
@media (max-width:760px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{appearance:none;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r12);padding:14px 16px 13px;cursor:pointer;box-shadow:var(--sh1);transition:border-color .15s,box-shadow .15s;position:relative}
.kpi:hover{border-color:var(--line-2)}
.kpi[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.kpi .k-n{font-family:var(--font-d);font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums lining-nums}
.kpi .k-l{font-size:13px;font-weight:500;color:var(--ink-2);margin-top:4px}
.kpi .k-s{font-size:12px;color:var(--ink-3);margin-top:1px;min-height:18px}
.kpi.zero .k-n{color:var(--ink-4)}
.kpi.warn .k-n{color:var(--warn-ink)}
.kpi.bad .k-n{color:var(--bad-ink)}
.kpi.bad{border-color:var(--bad-line)}
.kpi.win .k-n{color:var(--win-ink)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;line-height:20px;padding:1px 9px 1px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill i{width:6px;height:6px;border-radius:50%;flex:none;background:currentColor;opacity:.9}
.pill svg{flex:none}
.pill.win{background:var(--win-tint);color:var(--win-ink);border-color:var(--win-line)}
.pill.ok{background:transparent;color:var(--win-ink);border-color:var(--win-line)}
.pill.warn{background:var(--warn-tint);color:var(--warn-ink);border-color:var(--warn-line)}
.pill.bad{background:var(--bad-tint);color:var(--bad-ink);border-color:var(--bad-line)}
.pill.neutral{background:var(--neutral-tint);color:var(--neutral-ink)}
.pill.outline{background:transparent;color:var(--ink-3);border-color:var(--line-2)}

/* card + list */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r12);box-shadow:var(--sh1);overflow:hidden}
.row{display:grid;align-items:center;gap:16px;padding:13px 18px;border-top:1px solid var(--line);cursor:pointer;background:var(--surface);transition:background .12s}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;border-radius:0}
.ttl{font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.sub{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* action queue */
.q-row{grid-template-columns:186px minmax(0,1fr) auto}
.q-act{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;padding:5px 11px;border:1px solid var(--line-2);border-radius:var(--r8);background:var(--surface)}
.q-act svg{opacity:.55}
.q-row.sev-bad .q-act{color:var(--bad-ink);border-color:var(--bad-line);background:var(--bad-tint)}
.q-row.sev-win .q-act{color:var(--win-ink);border-color:var(--win-line);background:var(--win-tint)}
.q-row.sev-bad{box-shadow:inset 3px 0 0 var(--bad-fill)}
.q-more{padding:10px 18px;border-top:1px solid var(--line);font-size:13px;background:var(--surface)}
@media (max-width:900px){.q-row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"p a" "t t"}.q-row>.q-p{grid-area:p}.q-row>.q-t{grid-area:t}.q-row>.q-a{grid-area:a}}
/* grouped queue: one card per action, worst group first */
.qg{margin-bottom:12px}
.qg-h{appearance:none;width:100%;display:grid;grid-template-columns:18px auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r12);padding:12px 18px;cursor:pointer;box-shadow:var(--sh1)}
.qg-h:hover{border-color:var(--line-2)}
.qg.open .qg-h{border-radius:var(--r12) var(--r12) 0 0;border-bottom-color:var(--line)}
.qg-h .chev{transition:transform .15s;color:var(--ink-3);display:inline-flex}
.qg.open .qg-h .chev{transform:rotate(90deg)}
.qg-h .gt{font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap}
.qg-h .gn{font-variant-numeric:tabular-nums;font-size:12px;font-weight:600;padding:0 8px;line-height:20px;border-radius:999px;background:var(--neutral-tint);color:var(--neutral-ink);margin-left:8px}
.qg.g-bad .qg-h .gn{background:var(--bad-tint);color:var(--bad-ink)}
.qg.g-warn .qg-h .gn{background:var(--warn-tint);color:var(--warn-ink)}
.qg-h .gg{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qg-h .gx{font-size:12px;color:var(--ink-3);white-space:nowrap}
.qg-b{border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r12) var(--r12);overflow:hidden;background:var(--surface);box-shadow:var(--sh1)}
.qg:not(.open) .qg-b{display:none}
@media (max-width:900px){.qg-h{grid-template-columns:18px minmax(0,1fr) auto;row-gap:4px}.qg-h .chev{grid-row:1;grid-column:1}.qg-h .gt{grid-row:1;grid-column:2}.qg-h .gx{grid-row:1;grid-column:3}.qg-h .gg{grid-row:2;grid-column:2/-1;white-space:normal}}
.q-row.sel-row{grid-template-columns:22px 186px minmax(0,1fr) auto}
@media (max-width:900px){.q-row.sel-row{grid-template-columns:22px minmax(0,1fr) auto;grid-template-areas:"c p a" "c t t"}.q-row.sel-row>.q-c{grid-area:c}}
.q-c input{width:16px;height:16px;accent-color:var(--brand);cursor:pointer;margin:0}
.ttl-btn{appearance:none;background:none;border:0;padding:0;margin:0;text-align:left;font:inherit;color:inherit;cursor:pointer;display:block;max-width:100%}
.ttl-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.q-due{font-size:12px;color:var(--warn-ink);font-weight:500;white-space:nowrap}
.q-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 18px;border-top:1px solid var(--line);background:var(--surface-2);font-size:13px;color:var(--ink-3)}
.btn{appearance:none;font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:var(--r8);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-4)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.alert{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r12);border:1px solid var(--bad-line);background:var(--bad-tint);color:var(--bad-ink);margin:0 0 16px;font-size:14px}
.alert b{font-weight:600}
.alert>div{flex:1 1 420px}
.copybox{margin-top:10px}
.copybox textarea{width:100%;min-height:110px;font:12px/1.5 ui-monospace,Consolas,monospace;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r8);padding:8px}
.r-head.nostats,.r-row.nostats{grid-template-columns:minmax(0,1fr) 200px 190px}

.empty{padding:28px 18px;text-align:center;color:var(--ink-3);font-size:14px}
.empty b{display:block;color:var(--ink);font-family:var(--font-d);font-weight:600;font-size:17px;margin-bottom:2px}
.empty .ic{width:34px;height:34px;border-radius:50%;background:var(--win-tint);color:var(--win-ink);display:inline-flex;align-items:center;justify-content:center;margin-bottom:8px}

/* running */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;background:var(--neutral-tint);border-radius:var(--r8);padding:2px}
.seg button{appearance:none;border:0;background:none;padding:4px 10px;border-radius:6px;font-size:13px;color:var(--ink-3);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh1);font-weight:500}
.inp,.sel{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r8);padding:5px 10px;height:31px}
.inp:focus,.sel:focus{outline:none;border-color:var(--g500);box-shadow:0 0 0 3px color-mix(in srgb,var(--g500) 18%,transparent)}
.inp{min-width:180px}
.grow{flex:1}

.r-head,.r-row{grid-template-columns:minmax(0,1fr) 172px 168px 136px 168px}
.r-name .ttl{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.4}
.drawer:focus{outline:none}
.r-head{display:grid;gap:16px;padding:9px 18px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-3);font-weight:500;background:var(--surface)}
.r-head button{appearance:none;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.r-head button:hover{color:var(--ink)}
.r-head [aria-sort="ascending"] .ar::after{content:"↑"}.r-head [aria-sort="descending"] .ar::after{content:"↓"}
.r-head .ar{font-size:11px;color:var(--ink)}
.r-name .themes{display:flex;gap:6px;margin-top:3px;overflow:hidden}
.theme{font-size:12px;color:var(--ink-3);white-space:nowrap}
.theme+.theme::before{content:"·";margin-right:6px;color:var(--ink-5)}
.cell-l{font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;gap:6px;margin-bottom:5px;white-space:nowrap}
.cell-l b{font-weight:500;color:var(--ink-2)}
.cell-l .over{color:var(--warn-ink);font-weight:500}
@media (max-width:1040px){.r-head,.r-row{grid-template-columns:minmax(0,1fr) 170px 140px 130px 160px}}
@media (max-width:900px){
  .r-head{display:none}
  .r-row{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"n n h" "t m g";row-gap:10px}
  .r-row>.c-n{grid-area:n}.r-row>.c-t{grid-area:t}.r-row>.c-m{grid-area:m}.r-row>.c-g{grid-area:g}.r-row>.c-h{grid-area:h;justify-self:end}
}

/* timeline bar */
.tl{position:relative;height:6px;border-radius:3px;background:var(--track)}
.tl .f{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--g500)}
.tl .f.over{background:linear-gradient(90deg,var(--g500) 0,var(--g500) var(--rv),color-mix(in srgb,var(--warn-fill) 50%,var(--track)) var(--rv))}
.tl .rv{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink-2);border-radius:1px;transform:translateX(-1px)}
.tl .mx{position:absolute;right:0;top:-2px;width:2px;height:10px;background:var(--ink-5);border-radius:1px}
/* chance gauge */
.gz{display:flex;align-items:center;gap:10px}
.gz .bar{position:relative;flex:1;height:6px;border-radius:3px;background:var(--track)}
.gz .bar .f{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ink-4)}
.gz .bar .f.win{background:var(--win-fill)}
.gz .bar .f.lose{background:var(--warn-fill)}
.gz .bar .f.ev{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.45) 0 2px,transparent 2px 5px)}
.gz .bar .th{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink);border-radius:1px;transform:translateX(-1px)}
.gz .v{font-size:13px;font-weight:600;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.gz .v.win{color:var(--win-ink)}.gz .v.lose{color:var(--warn-ink)}
.na{font-size:12px;color:var(--ink-3)}
.mval{font-size:13px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.mval .arw{color:var(--ink-5);margin:0 4px}
.mcnt{font-size:12px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}

.planned{margin-top:10px;font-size:13px;color:var(--ink-3)}
.planned summary{cursor:pointer;width:max-content}
.planned ul{margin:8px 0 0;padding:0;list-style:none}
.planned li{padding:6px 0;border-top:1px dashed var(--line);display:flex;gap:10px;justify-content:space-between}

/* decided + changes */
.d-row{grid-template-columns:118px minmax(0,1fr) 170px}
.d-row .take{font-size:13px;color:var(--ink-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;margin-top:2px}
.d-meta{font-size:12px;color:var(--ink-3);text-align:right;white-space:nowrap}
@media (max-width:900px){.d-row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"b m" "t t"}.d-row>.d-b{grid-area:b}.d-row>.d-t{grid-area:t}.d-row>.d-meta{grid-area:m}}
.chipbar{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-size:13px;padding:3px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);background:var(--win-tint);font-weight:500}
.chip .c{color:var(--ink-3);margin-left:4px;font-variant-numeric:tabular-nums}

.day-h{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;margin:22px 0 8px}
.day-h:first-child{margin-top:0}
.ch{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}
.ch:first-child{border-top:0}
.ch.unlogged{box-shadow:inset 3px 0 0 var(--warn-fill);background:linear-gradient(90deg,var(--warn-tint),var(--surface) 55%)}
.src{font-size:12px;font-weight:500;color:var(--ink-2);background:var(--neutral-tint);padding:1px 8px;border-radius:var(--r6);display:inline-block;white-space:nowrap}
.ch .when{font-size:12px;color:var(--ink-3);margin-top:4px;font-variant-numeric:tabular-nums}
.ch .txt{font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ch .txt.open{-webkit-line-clamp:unset;display:block}
.ch .foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px;font-size:12px;color:var(--ink-3)}
.xchip{appearance:none;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r6);font-size:12px;padding:1px 7px;cursor:pointer;color:var(--ink-2);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xchip:hover{border-color:var(--line-2)}

/* results log (decided) */
.d-row{grid-template-columns:118px minmax(0,1fr) 190px}
.d-row .fin{font-size:13px;color:var(--ink-2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.ncount{font-size:12px;color:var(--ink-3);margin-top:3px}
/* calendar */
.upc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}
@media (max-width:900px){.upc{grid-template-columns:1fr}}
.upc .card{padding:12px 14px}
.upc h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
.upc ul{list-style:none;margin:0;padding:0}
.upc li{padding:7px 0;border-top:1px solid var(--line);font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.upc li:first-child{border-top:0}
.upc li .linkbtn{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--ink);font-weight:500}
.upc li span{font-size:12px;color:var(--ink-3);white-space:nowrap}
.gantt{--gl:230px;overflow-x:auto;overflow-y:hidden;max-width:100%;border:1px solid var(--line);border-radius:var(--r12);background:var(--surface);box-shadow:var(--sh1)}
.gin{position:relative}
.ghead{position:sticky;top:0;height:40px;border-bottom:1px solid var(--line);background:var(--surface);z-index:2}
.glab{position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--line);width:var(--gl);flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;height:34px;font-size:13px}
.glab .linkbtn{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;font-size:13px}
@media (max-width:620px){.gantt{--gl:150px}}
.grow2{position:relative;display:flex;height:34px;border-top:1px solid var(--line)}
.gtrack{position:relative;flex:none}
.gbar{position:absolute;top:9px;height:16px;border-radius:4px;border:0;padding:0;cursor:pointer}
.gbar.live{background:var(--g500)}
.gbar.rot{background:var(--g700)}
.gbar.dec{background:var(--ink-5)}
.gbar.plan{background:transparent;border:1.5px dashed var(--ink-4)}
.gbar.tail{background:color-mix(in srgb,var(--g500) 25%,transparent);border-radius:0 4px 4px 0;cursor:pointer}
.gbar.pause{background-image:repeating-linear-gradient(135deg,var(--ink-4) 0 2px,transparent 2px 6px);background-color:var(--neutral-tint)}
.gbar:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.gmk{position:absolute;top:13px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--surface);border:2px solid var(--ink-2);pointer-events:none}
.gmk.dec{border-radius:1px;transform:rotate(45deg);background:var(--ink-2)}
.gtoday{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--bad-fill);z-index:1;pointer-events:none}
.gmon{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--line);pointer-events:none}
.gmon.call{border-left:1px dashed var(--ink-5)}
.gm-l{position:absolute;top:4px;font-size:11px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.gw-l{position:absolute;top:22px;font-size:11px;color:var(--ink-4);white-space:nowrap;transform:translateX(3px)}
.gw-l.today{color:var(--bad-ink);font-weight:600}
.gkey{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin:10px 0 0}
.gkey i{display:inline-block;width:18px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
/* buckets */
.bk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:900px){.bk{grid-template-columns:1fr}}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r12);box-shadow:var(--sh1);padding:14px 16px}
.bcard.bc-empty{border-style:dashed;box-shadow:none;background:transparent}
.bcard h3{font-family:var(--font-d);font-weight:600;font-size:16px;margin:0 0 2px}
.bcard .bs{font-size:12px;color:var(--ink-3);margin-bottom:10px}
.bl{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px solid var(--line);align-items:start}
.bl .t{font-size:12px;color:var(--ink-3);font-weight:500;padding-top:3px}
.bchips{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.bchip{appearance:none;font:inherit;font-size:12px;display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:2px 9px 2px 7px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bchip:hover{border-color:var(--ink-4)}
.bchip i{width:8px;height:8px;border-radius:50%;flex:none}
.bchip.rot{border-color:var(--g500);font-weight:600}
.bnone{font-size:12px;color:var(--ink-4);padding-top:3px}
.bempty{font-size:13px;color:var(--ink-3)}
.dcount{font-size:12px;color:var(--ink-3);padding-top:3px}
.dcount b{color:var(--ink-2);font-weight:600}

/* ── v3 (2026-11-19): one view. Calendar strip, toolbar, card grid. ───── */
.hdr-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.needbadge{cursor:pointer;font-weight:600}
.ovf{position:relative}
.ovf>summary{list-style:none;display:inline-flex;align-items:center;gap:6px}
.ovf>summary::marker{content:""}
.ovf>summary::-webkit-details-marker{display:none}
.ovf .dot{position:static;width:6px;height:6px;border-radius:50%;background:var(--warn-fill);display:inline-block}
.ovf .menu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:260px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r8);box-shadow:var(--sh2);padding:4px;display:flex;flex-direction:column}
.ovf .menu button{appearance:none;border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px;font-size:13px;color:var(--ink);cursor:pointer}
.ovf .menu button:hover{background:var(--surface-2)}
.back{margin:14px 0 18px}
.xbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0 8px}
.xbar2{margin:0 0 12px}
.xq{flex:1 1 280px;min-width:200px}
.xbar .sel{flex:0 1 auto;max-width:100%}
.xg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:980px){.xg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.xg{grid-template-columns:minmax(0,1fr)}.xbar .sel{flex:1 1 140px}.bk-tag{display:none}}
.xc{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r12);box-shadow:var(--sh1);padding:12px 14px;cursor:pointer;min-width:0;transition:border-color .15s,box-shadow .15s,transform .15s}
.xc:hover{border-color:var(--line-2);box-shadow:var(--sh2);transform:translateY(-1px)}
.xc:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.xc.s-call{border-left:3px solid var(--warn-fill)}
.xc.s-running{border-left:3px solid var(--g500)}
.xc.s-planned{border-left:3px dashed var(--line-2)}
.xt{display:flex;gap:6px;align-items:center;min-width:0}
.xt .pill{flex:none}
.rotp{font-size:11px}
.bk-tag{font-size:11px;color:var(--ink-3);background:var(--neutral-tint);padding:1px 8px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.xc h3{font-family:var(--font-d);font-weight:600;font-size:16px;line-height:1.3;margin:2px 0 0;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.xs{margin:0;font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.xs b{color:var(--ink-3);font-weight:500}
.xs.muted{color:var(--ink-4)}
.xw{font-size:12px;color:var(--ink-3)}
.xp{height:4px;border-radius:2px;background:var(--track);overflow:hidden}
.xp i{display:block;height:100%;background:var(--g500);border-radius:2px}
.xp.over i{background:var(--warn-fill)}
.xp.none{background:transparent}
.xo{font-size:13px;color:var(--ink-2);padding:6px 8px;background:var(--surface-2);border-radius:var(--r6)}
.xo .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.xo .arw{color:var(--ink-4);margin:0 2px}
.xo b{font-weight:600}
.xo b.up{color:var(--win-ink)} .xo b.dn{color:var(--bad-ink)}
.xo .ml{font-size:11px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xo.none{color:var(--ink-4);font-size:12px}
.xo.none span{color:var(--ink-3);font-weight:500}
.xr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;min-height:22px}
.xn{color:var(--ink-3)} .xn b{color:var(--ink);font-weight:600}
.xf{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-3);margin-top:auto}
.xh{display:inline-flex;gap:4px;align-items:center;color:var(--warn-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.xnn{white-space:nowrap}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r12);padding:8px 14px;margin:0 0 4px;font-size:13px}
.sc>summary{cursor:pointer;color:var(--ink-2);list-style:none;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.sc>summary::-webkit-details-marker{display:none}
.sc>summary::before{content:"";width:0;height:0;border:4px solid transparent;border-left:5px solid var(--ink-4);margin-right:2px;align-self:center;transition:transform .15s}
.sc[open]>summary::before{transform:rotate(90deg) translateX(2px)}
.sc-in{display:inline-flex;gap:14px;flex-wrap:wrap}
.sc-i{white-space:nowrap;color:var(--ink-3)} .sc-i b{color:var(--ink);font-weight:600}
.sc-hint{font-size:12px;color:var(--ink-4);margin-left:auto}
.sc-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
@media (max-width:620px){.sc-g{grid-template-columns:minmax(0,1fr)}.sc-hint{display:none}}
.sc-t{background:var(--surface-2);border-radius:var(--r8);padding:8px 10px;min-width:0}
.sc-l{font-size:12px;color:var(--ink-3)}
.sc-v b{font-family:var(--font-d);font-size:18px;font-weight:600;color:var(--ink)}
.sc-c,.sc-w{font-size:12px;color:var(--ink-3)}
.sc-d{font-size:12px;color:var(--ink-3)} .sc-d.up{color:var(--win-ink)} .sc-d.dn{color:var(--bad-ink)}
.sc-na{font-size:12px;color:var(--ink-4)}
.wh{background:var(--surface);border:1px solid var(--line);border-radius:var(--r12);padding:14px 18px;margin-bottom:14px}
.wh h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.wh .tldr{font-family:var(--font-d);font-size:16px;line-height:1.5;color:var(--ink);margin:0 0 8px}
.wh p{margin:0 0 8px;font-size:14px;color:var(--ink-2)}
.wh dl{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 14px;margin:0;font-size:14px}
.wh dt{color:var(--ink-3);font-weight:500}
.wh dd{margin:0;color:var(--ink-2)}
@media (max-width:620px){.wh dl{grid-template-columns:1fr}.wh dt{margin-top:6px}}

/* ── Simple view (owner 2026-11-21): big plain cards, a readable timeline, a short decided list ── */
.wrap{font-size:15px}
.hdr h1{font-size:30px}
.hdr .meta{font-size:14px}
.banner{font-size:14px}
.nw-sec{margin:28px 0 36px}
.nw-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.nw-h h2{font-family:var(--font-d);font-weight:600;font-size:24px;line-height:1.2;margin:0;color:var(--ink)}
.nw-h span{font-size:14px;color:var(--ink-3)}
.nw-empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r12);padding:22px;text-align:center;color:var(--ink-3);font-size:16px}
.nw-cards{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.nw-card{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r16);box-shadow:var(--sh1);padding:22px 24px;cursor:pointer;min-width:0;transition:border-color .15s,box-shadow .15s}
.nw-card:hover{border-color:var(--line-2);box-shadow:var(--sh2)}
.nw-card:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.nw-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nw-run{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--win-ink)}
.nw-run i{width:9px;height:9px;border-radius:50%;background:var(--win-fill)}
.nw-rot{font-size:13px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:999px;padding:1px 10px}
.nw-card h3{font-family:var(--font-d);font-weight:600;font-size:21px;line-height:1.35;margin:0;color:var(--ink);overflow-wrap:anywhere}
.nw-what{margin:0;font-size:16px;line-height:1.5;color:var(--ink-2)}
.nw-what span,.nw-dates span,.nv-k,.nw-note span{display:block;font-size:13px;font-weight:600;color:var(--ink-3);margin-bottom:2px}
.nw-what em{color:var(--ink-4)}
.nw-dates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.nw-dates b{font-size:17px;font-weight:600;color:var(--ink)}
.nw-dates em{font-style:normal;font-size:14px;color:var(--ink-3);margin-left:8px}
.nw-metric{font-size:15px;color:var(--ink-3)}
.nw-metric b{color:var(--ink-2);font-weight:600}
.nw-nums{display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr) minmax(0,1.15fr);gap:12px;align-items:stretch}
.nv{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r12);padding:12px 14px;min-width:0}
.nv.warn{background:var(--warn-tint);border-color:var(--warn-line)}
.nv-v{font-family:var(--font-d);font-weight:600;font-size:30px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums lining-nums}
.nv-v.muted{color:var(--ink-4);font-size:24px}
.nv-v.good{color:var(--win-ink)}
.nv-s{font-size:14px;color:var(--ink-3);margin-top:2px}
.nv-none{font-size:16px;font-weight:600;line-height:1.35;color:var(--warn-ink);margin-top:2px}
.nv-arrow{display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--ink-4)}
.nv-bar{position:relative;height:10px;border-radius:5px;background:var(--track);margin:8px 0 4px}
.nv-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ink-4)}
.nv-bar i.ok{background:var(--win-fill)}
.nv-bar b{position:absolute;top:-4px;width:3px;height:18px;border-radius:2px;background:var(--ink);transform:translateX(-1.5px)}
.nw-sofar{font-size:16px;line-height:1.5;color:var(--ink);padding:12px 14px;border-radius:var(--r12);background:var(--neutral-tint);border:1px solid var(--line)}
.nw-sofar b{font-weight:600}
.nw-sofar.t-win{background:var(--win-tint);border-color:var(--win-line);color:var(--win-ink)}
.nw-sofar.t-lean-good{background:var(--win-tint);border-color:var(--win-line)}
.nw-sofar.t-warn,.nw-sofar.t-lean-bad{background:var(--warn-tint);border-color:var(--warn-line);color:var(--warn-ink)}
.nw-sofar.t-bad{background:var(--bad-tint);border-color:var(--bad-line);color:var(--bad-ink)}
.nw-conf{display:block;font-size:14px;color:var(--ink-3);margin-top:4px}
.nw-note{font-size:14px;color:var(--ink-2);border-left:3px solid var(--line-2);padding:2px 0 2px 12px}
.nw-note p{margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nw-more{font-size:15px;font-weight:600;color:var(--brand);margin-top:auto}
.nw-planned{font-size:15px;color:var(--ink-3);margin:14px 0 0}
.nw-planned .linkbtn{font-size:15px}
@media (max-width:620px){
  .hdr h1{font-size:26px}
  .nw-card{padding:18px 16px}
  .nw-nums{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .nv-arrow{display:none}
  .nv-ch{grid-column:1/-1}
  .nv-v{font-size:26px}
}
/* timeline: names column + bars column; names wrap, never cut off */
.tlc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r12);box-shadow:var(--sh1);padding:6px 0}
.tr{display:grid;grid-template-columns:minmax(200px,38%) minmax(0,1fr);gap:16px;align-items:center;padding:10px 18px;border-top:1px solid var(--line);cursor:pointer}
.tr:hover{background:var(--surface-2)}
.tr:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.tr.thead{border-top:0;cursor:default;padding-top:6px;padding-bottom:6px}
.tr.thead:hover{background:none}
.tr.thead+.tr{border-top:1px solid var(--line)}
.tn b{display:block;font-size:15px;font-weight:600;line-height:1.35;color:var(--ink);overflow-wrap:anywhere}
.tn span{display:block;font-size:14px;color:var(--ink-3);margin-top:2px}
.tt{position:relative;height:22px}
.thead .tt{height:20px}
.tk{position:absolute;top:0;transform:translateX(-50%);font-size:14px;color:var(--ink-3);white-space:nowrap}
.tk.today{color:var(--bad-ink);font-weight:600;transform:translateX(-50%)}
.ttoday{position:absolute;top:-10px;bottom:-10px;width:2px;margin-left:-1px;background:var(--bad-fill);opacity:.55}
.tb{position:absolute;top:5px;height:12px;border-radius:6px}
.tb.live{background:var(--win-fill)}
.tb.plan{background:transparent;border:2px dashed var(--win-line);border-left:0;border-radius:0 6px 6px 0;height:12px}
.tdec{position:absolute;top:2px;width:3px;height:18px;margin-left:-1.5px;border-radius:2px;background:var(--ink-2)}
.tdot{position:absolute;top:4px;width:14px;height:14px;margin-left:-7px;border-radius:50%}
.o-shipped{background:var(--win-fill)} .o-reverted{background:var(--warn-fill)} .o-shelved{background:var(--ink-5)} .o-inconclusive,.o-unknown{background:var(--line-2)}
.tkey{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--ink-3);margin:10px 2px 0}
.tkey i.k{display:inline-block;width:22px;height:10px;border-radius:5px;margin-right:7px;vertical-align:-1px}
.tkey i.k.live{background:var(--win-fill)} .tkey i.k.plan{background:transparent;border:2px dashed var(--win-line)}
@media (max-width:620px){
  .tr{grid-template-columns:minmax(0,1fr);gap:6px;padding:10px 14px}
  .tr.thead .tn{display:none}
}
.tl-more>summary{cursor:pointer;font-size:15px;font-weight:600;color:var(--brand);padding:10px 18px;border-top:1px solid var(--line)}
/* decided list */
.dl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r12);box-shadow:var(--sh1);overflow:hidden}
.dr{display:grid;grid-template-columns:150px minmax(0,1fr) 120px;gap:16px;align-items:start;padding:13px 18px;border-top:1px solid var(--line);cursor:pointer}
.dr:first-child{border-top:0}
.dr:hover{background:var(--surface-2)}
.dr:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.dr .pill{font-size:14px;line-height:24px;justify-self:start}
.dr-t b{display:block;font-size:15px;font-weight:600;line-height:1.4;color:var(--ink);overflow-wrap:anywhere}
.dr-t p{margin:3px 0 0;font-size:14px;color:var(--ink-3);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dr-d{font-size:14px;color:var(--ink-3);text-align:right;white-space:nowrap;padding-top:2px}
.dl-more{margin-top:12px}
.dl-more>summary{cursor:pointer;font-size:15px;font-weight:600;color:var(--brand);padding:6px 0;width:max-content}
.dl-more .dl{margin-top:8px}
@media (max-width:620px){.dr{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"o d" "t t";gap:8px;padding:12px 14px}.dr>.dr-o{grid-area:o}.dr>.dr-d{grid-area:d}.dr>.dr-t{grid-area:t}}
/* details for the team (the old full view, closed by default) */
.nw-det{margin:8px 0 0;border-top:1px solid var(--line);padding-top:6px}
.nw-det>summary{cursor:pointer;padding:12px 0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;list-style:none}
.nw-det>summary::-webkit-details-marker{display:none}

<div class="scrim" id="scrim" aria-hidden="true"></div>

<script>
window.__SNAPSHOT__ = /*__SNAPSHOT__*/null;
window.__THEME__ = /*__THEME__*/null;
</script>
<script>
(function(){
"use strict";
/* ── Two ways in. (1) Static: the snapshot is injected into window.__SNAPSHOT__ (preview,
   st.iframe fallback). (2) Streamlit custom component: this file is served as-is and the
   snapshot arrives in a "streamlit:render" message; writing a note sends a component value
   back (the only thing that makes the dash rerun). Everything else stays client-side.
   State that must survive a re-render (tab, filters, open drawer, note drafts, notes still
   being saved) lives outside boot(). */
var KEEP = {ST: null, openId: null, scroll: 0, drafts: {}, kind: {}, call: {}};
var PENDING = {};          // note_id -> {exp_id, note}  optimistic notes not yet in the snapshot
var CTX = {canWrite: false, writeNote: "", results: {}, inSt: false};
var CUR = {};              // current boot's closeDrawer/drawer for the once-only document listeners
function stSend(type, data){ try { window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, data || {}), "*"); } catch (err) {} }
function freshNode(id){ var o = document.getElementById(id); var n = o.cloneNode(false); o.parentNode.replaceChild(n, o); return n; }
var lastSig = null;
window.addEventListener("message", function(ev){
  var d = ev.data;
  if (!d || d.type !== "streamlit:render") return;
  CTX.inSt = true;
  var a = d.args || {};
  CTX.canWrite = !!a.can_write; CTX.writeNote = a.write_note || ""; CTX.results = a.note_results || {};
  var sig = String(a.sig || "") + "|" + JSON.stringify(CTX.results) + "|" + CTX.canWrite;
  if (sig === lastSig) return;
  lastSig = sig;
  boot(a.snapshot || {}, a.theme || null);
});
document.addEventListener("keydown", function(ev){ if (CUR.onKey) CUR.onKey(ev); });

function boot(S, themeArg){
S = S || {};
var app = freshNode("app");
var drawer = freshNode("drawer");
var scrim = freshNode("scrim");

/* ── hash params (preview + headless screenshots): #tab=decided&exp=ID&filter=stale&theme=dark&queue=all */
var H = {};
try { (location.hash || "").replace(/^#/, "").split("&").forEach(function(kv){ if(!kv) return; var p = kv.split("="); H[decodeURIComponent(p[0])] = decodeURIComponent(p.slice(1).join("=") || ""); }); } catch(e) {}
var theme = themeArg || H.theme || "light";
if (["light","sepia","dark"].indexOf(theme) < 0) theme = "light";
document.documentElement.setAttribute("data-theme", theme);

/* ── helpers */
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function arr(x){ return Array.isArray(x) ? x : (x == null || x === "" ? [] : [x]); }
function obj(x){ return x && typeof x === "object" && !Array.isArray(x) ? x : {}; }
function num(x){ var n = typeof x === "number" ? x : parseFloat(x); return isFinite(n) ? n : null; }
function fmtInt(n){ n = num(n); return n == null ? "–" : Math.round(n).toLocaleString("en-US"); }
function pct(x, d){ x = num(x); if (x == null) return "–"; var v = x * 100; d = d == null ? (Math.abs(v) < 10 ? 1 : 0) : d; return v.toFixed(d) + "%"; }
function chance(p){ p = num(p); if (p == null) return "–"; if (p >= 0.995) return ">99%"; if (p <= 0.005) return "<1%"; return Math.round(p * 100) + "%"; }

var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function pd(s){ if(!s) return null; var m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(Date.UTC(+m[1], +m[2]-1, +m[3])) : null; }

function addDays(s, n){ var d = pd(s); if(!d || num(n) == null) return null; d.setUTCDate(d.getUTCDate() + Math.round(n)); return d.toISOString().slice(0,10); }
var TODAY = S.today || (S.generated_at ? String(S.generated_at).slice(0,10) : new Date().toISOString().slice(0,10));
function daysBetween(a, b){ var x = pd(a), y = pd(b); return x && y ? Math.round((y - x) / 864e5) : null; }
function trunc(s, n){ s = String(s || ""); return s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s; }
var ICON = {
  arrow:'<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  clock:'<svg width="11" height="11" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 4.6V8l2.3 1.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  check:'<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  x:'<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'
};

/* ── field access (tolerant of v1, v2, engine and brief shapes) */
function nameOf(e){ e = obj(e); var w = obj(e.what); return e.name || w.name || (typeof e.what === "string" ? e.what : "") || e.what_changed || e.id || "(unnamed experiment)"; }
function whatChanged(e){ var w = obj(e.what); return w.what_changed || (typeof e.what === "string" ? e.what : "") || e.what_changed || ""; }
function linksOf(e){ return arr(obj(e.what).links).concat(e.what && typeof e.what === "object" ? [] : arr(e.links)); }
function surfacesOf(e){ return arr(obj(e.impacts).surfaces).length ? arr(obj(e.impacts).surfaces) : arr(e.surfaces); }
function audienceOf(e){ var a = obj(e.impacts).audience; if (a && typeof a === "object") return a; return typeof e.audience === "string" ? {segment: e.audience} : obj(e.audience); }
function metricOf(e){ var m = obj(obj(e.success_metric).metric); return Object.keys(m).length ? m : obj(e.metric); }
function planOf(e){ return obj(obj(e.success_metric).sample_plan || e.sample_plan); }
function ruleOf(e){ var r = obj(e.decision_rule); if (!Object.keys(r).length) r = obj(obj(e.success_metric).decision_rule); return {ship_p: num(r.ship_p) == null ? 0.9 : num(r.ship_p), stop_p: num(r.stop_p) == null ? 0.1 : num(r.stop_p), max_loss: num(r.max_loss) == null ? 0.005 : num(r.max_loss)}; }
function tlOf(e){ var t = obj(e.timeline); return {start: t.start_date || e.start_date, planned: num(t.planned_days != null ? t.planned_days : e.planned_days), review: t.review_date || e.review_date, max: num(t.max_days != null ? t.max_days : e.max_days)}; }
function statsOf(e){ var s = obj(e.stats); if (s.p_beat != null || s.control_rate != null || s.treatment_rate != null) return s; var r = obj(e.readout); return r.p_beat != null ? r : null; }
function atypeOf(e){ return e.assignment_type || obj(e.assignment).type || null; }
function readoutOf(e){ return obj(e.readout); }
function themesOf(e){ return arr(e.themes).filter(Boolean); }
function reportingOf(e){ var r = e.reporting; if (r && typeof r === "object") r = r.mode || r.type; return String(r || "manual").toLowerCase(); }
function errIssues(e){ return arr(e.spec_issues).filter(function(i){ return obj(i).severity === "error"; }); }
function lastResultDate(e){ var d = null; arr(e.results).forEach(function(r){ r = obj(r); if (r.date && (!d || String(r.date) > d)) d = String(r.date).slice(0,10); }); return d; }
function daysRunning(e){ if (num(e.days_running) != null) return num(e.days_running); var s = tlOf(e).start; return s ? daysBetween(s, TODAY) : null; }
function reviewDate(e){ var t = tlOf(e); return t.review || (t.start && t.planned ? addDays(t.start, t.planned) : null); }
function armsOf(e){ var a = obj(readoutOf(e).arms); if (a.control || a.treatment) return a; var s = statsOf(e) || {}; if (s.c_n != null || s.t_n != null) return {control: s.c_n != null ? {n: s.c_n, conv: s.c_conv} : null, treatment: s.t_n != null ? {n: s.t_n, conv: s.t_conv} : null}; return {}; }
function guardsOf(e){
  var spec = {}; arr(obj(e.success_metric).guardrails).concat(arr(e.guardrails)).forEach(function(g){ g = obj(g); if (g.key && (g.label || g.max_drop_rel != null || g.max_rise_rel != null)) spec[g.key] = Object.assign({}, spec[g.key] || {}, g); });
  var evald = arr(e.guardrails).filter(function(g){ return obj(g).breached != null || obj(g).p_breach != null; });
  var keys = {}; var out = [];
  evald.forEach(function(g){ keys[g.key] = 1; out.push(Object.assign({}, spec[g.key] || {}, g, {evaluated: true})); });
  Object.keys(spec).forEach(function(k){ if (!keys[k]) out.push(Object.assign({}, spec[k], {evaluated: false})); });
  return out;
}
function guardLabel(g){ return g.label || String(g.key || "guardrail").replace(/_/g, " "); }

/* ── health vocabulary */
var STATES = ["guardrail_breach","callable_win","callable_loss","needs_call","starved","no_data","zombie","manual_overdue","confounded","spec_incomplete","guardrail_unmonitored","on_track"];
var RANK = {}; STATES.forEach(function(s, i){ RANK[s] = i; });
var STALE = {starved:1, no_data:1, zombie:1, manual_overdue:1};
function engineOff(e){ return e.health === "no_data" && /no metric runner/i.test(String(readoutOf(e).error || "") + " " + String(e.reason || "")); }
function sev(e){ var h = e.health; if (engineOff(e)) return "neutral"; if (h === "guardrail_breach") return "bad"; if (h === "callable_win") return "win"; if (h === "on_track") return e.stale ? "warn" : "ok"; if (h === "confounded" || h === "spec_incomplete") return e.stale ? "warn" : "neutral"; if (!h) return "neutral"; return "warn"; }
function pillText(e){
  var h = e.health, od = num(e.overdue_days), dr = daysRunning(e);
  if (engineOff(e)) return "No numbers yet";
  switch (h) {
    case "guardrail_breach": return "Guardrail breach";
    case "callable_win": return "Ready to ship";
    case "callable_loss": return "Likely worse";
    case "needs_call": return e.stale ? "Stale · " + od + "d past review" : "Call due" + (od ? " · " + od + "d" : "");
    case "starved": return "Stale · can't finish";
    case "no_data": return e.stale ? "Stale · no data" : "Metric not read";
    case "zombie": return "Stale · " + (dr != null ? dr + "d live" : "overran");
    case "manual_overdue": { var sd = sinceReadout(e); return "Stale · no readout" + (sd != null ? " " + sd + "d" : ""); }
    case "confounded": return "Confounded";
    case "spec_incomplete": return "Spec incomplete";
    case "guardrail_unmonitored": return "Guardrail not watched";
    case "on_track": return "On track";
    // a state this page doesn't know yet (the engine grew one): show the engine's own name
    default: return h ? cap(String(h).replace(/_/g, " ")) : (e.lifecycle === "planned" ? "Planned" : (e.status || "Not live"));
  }
}
function isStaleish(e){ return !!e.stale || !!STALE[e.health] || (e.health === "needs_call" && e.stale); }
function pill(e){
  var s = sev(e), stale = /^Stale/.test(pillText(e));
  return '<span class="pill ' + s + '">' + (stale ? ICON.clock : "<i></i>") + esc(pillText(e)) + "</span>";
}
function actionVerb(e){
  if (engineOff(e)) return "Nothing to do";
  switch (e.health) {
    case "guardrail_breach": return "Pause or revert now";
    case "callable_win": return "Ship it";
    case "callable_loss": return "Revert it";
    case "needs_call": return e.stale ? "Call it or shelve" : "Make the call";
    case "starved": return "Shelve or redesign";
    case "no_data": return readoutOf(e).error ? "Fix the metric" : "Check it's switched on";
    case "zombie": return "Shelve it";
    case "manual_overdue": return "Get a readout";
    case "confounded": return "Treat as evidence";
    case "spec_incomplete": return "Complete the spec";
    case "guardrail_unmonitored": return "Fix the guardrail metric";
    case "on_track": return "Keep running";
    default: return e.action || "Open";
  }
}
var FIELD = {"name":"name","what_changed":"what changed","surfaces":"surfaces","audience.segment":"audience","hypothesis":"hypothesis","tests":"what it tests","metric.key":"metric","metric.direction":"metric direction","metric.mde_rel":"smallest lift","metric.baseline":"baseline","audience.est_daily_exposed":"couples/day","planned_days":"planned days","review_date":"review date","max_days":"stop date","reporting":"reporting","assignment":"assignment","rollback":"rollback","tier":"tier","start_date":"start date","guardrails":"guardrails"};
function humanReason(e){
  var st = statsOf(e) || {}, p = num(st.p_beat), r = ruleOf(e), dr = daysRunning(e), plan = planOf(e), t = tlOf(e);
  var rv = reviewDate(e), od = num(e.overdue_days);
  switch (e.health) {
    case "guardrail_breach": {
      var g = guardsOf(e).filter(function(x){ return x.breached; })[0] || {};
      var lim = g.max_rise_rel != null ? "up more than " + Math.round(g.max_rise_rel * 100) + "%" : "down more than " + Math.round((g.max_drop_rel != null ? g.max_drop_rel : 0.25) * 100) + "%";
      return cap(guardLabel(g)) + " likely " + lim + (g.p_breach != null ? " (" + chance(g.p_breach) + " sure)" : "") + ".";
    }
    case "callable_win": return chance(p) + " chance it's better (" + lift(st.lift_median_rel) + ") after " + dr + " days. Clears the " + chance(r.ship_p) + " bar." + (atypeOf(e) === "pre_post" ? " Before/after, not a split test." : "");
    case "callable_loss": return "Only " + chance(p) + " chance it's better (" + lift(st.lift_median_rel) + "). Clear enough to revert." + (atypeOf(e) === "pre_post" ? " Before/after, not a split test." : "");
    case "needs_call": return "Review was due " + fd(rv) + (od != null ? " (" + od + (od === 1 ? " day" : " days") + " ago)" : "") + (p != null ? ". " + chance(p) + " chance it's better so far." : ". No decision recorded.") + (e.stale ? " Call it from what you know, or shelve it." : "");
    case "starved": {
      var rate = num(plan.daily_exposed_per_arm) || num(e.exposure_per_arm_day);
      if (num(e.projected_days) != null && t.max) return "Needs ~" + fmtInt(plan.n_per_arm) + " couples a side" + (rate ? " at ~" + Math.round(rate) + "/day" : "") + ": day " + fmtInt(e.projected_days) + ", past the " + t.max + "-day stop.";
      return "Only ~" + (rate != null ? rate.toFixed(1) : "?") + " couples a day per side. Too few to ever call.";
    }
    case "no_data": return engineOff(e) ? "Reported automatically, but the experiments engine isn't connected, so it has no numbers yet." : readoutOf(e).error ? "The metric isn't being read (" + trunc(String(readoutOf(e).error).replace(/^metric failed:\s*/i, ""), 60) + ")." + (e.stale ? "" : " Not stale yet; fix it before it is.") : "No new couples for 3 days. Is it still switched on?";
    case "zombie": return "Live " + dr + " days, more than twice the planned " + t.planned + ".";
    case "manual_overdue": { var l = lastResultDate(e); return (l ? "Reported by hand; nobody has read it out for " + daysBetween(l, TODAY) + " days (last " + fd(l) + ")." : "Reported by hand; no readout in " + dr + " days live.") + " Ask Claude Code for a readout, or shelve it."; }
    case "confounded": return arr(e.overlapping_changes).length + " other launches overlap its window. Evidence, not proof.";
    case "spec_incomplete": { var m = errIssues(e).map(function(i){ return FIELD[i.field] || String(i.field || "").replace(/_/g, " "); }); var u = m.filter(function(x, i){ return m.indexOf(x) === i; }); return "Missing " + u.slice(0, 3).join(", ") + (u.length > 3 ? " and " + (u.length - 3) + " more" : "") + "."; }
    case "guardrail_unmonitored": { var um = guardsOf(e).filter(function(x){ return !x.evaluated || x.unmonitored; }).map(guardLabel); return (um.length ? cap(um.join(", ")) : "A guardrail") + " isn't being measured, so a drop there would go unnoticed." + (p != null ? " " + chance(p) + " chance it's better so far." : ""); }
    case "on_track": return (p != null ? chance(p) + " chance it's better · " : "") + (num(e.days_left) != null ? "~" + e.days_left + " days to review" : "running");
    default: return e.reason || "";
  }
}
function cap(s){ s = String(s || ""); return s.charAt(0).toUpperCase() + s.slice(1); }
function sinceReadout(e){ var l = lastResultDate(e) || tlOf(e).start; return l ? daysBetween(l, TODAY) : null; }
/* days until a not-yet-stale call goes stale (needs_call turns stale 3 days past review) */
function staleIn(e){ var od = num(e.overdue_days); if (e.health === "needs_call" && !e.stale && od != null) return Math.max(3 - od, 0); return null; }

/* ── queue groups: what kind of thing the founder has to do */
var GROUPS = [
  {id: "decide",   title: "Decide now",              cls: "g-warn", guide: "The data is clear, or the review date has passed. Make the call."},
  {id: "stale",    title: "Stale: call it or shelve", cls: "g-warn", guide: "Stuck: overdue, no readout, too few couples or no data. Each row says why."},
  {id: "spec",     title: "Fix the setup",            cls: "",       guide: "Live, but the spec has gaps or the metric isn't being read. Ask Claude Code to fix it."},
  {id: "waiting",  title: "Waiting for live numbers", cls: "",       guide: "No action. Read automatically, but the engine isn't connected, so there is nothing to read yet."},
  {id: "evidence", title: "Before/after only",        cls: "",       guide: "No action today. Before/after tests with 2+ other launches in the window: evidence, not proof."}
];
function groupOf(e){
  if (engineOff(e)) return "waiting";
  if (/^(guardrail_breach|callable_win|callable_loss)$/.test(e.health) || (e.health === "needs_call" && !e.stale)) return "decide";
  // trust the engine's stale flag (it is what the daily DM counts); a metric that failed but is
  // not stale yet is a setup problem, not a shelve decision
  if (e.stale || e.health === "needs_call" || (STALE[e.health] && e.health !== "no_data")) return "stale";
  if (e.health === "spec_incomplete" || e.health === "no_data" || e.health === "guardrail_unmonitored") return "spec";
  if (e.health && e.health !== "on_track" && RANK[e.health] == null) return "spec";  // unknown state: surface it, don't drop it
  if (e.health === "confounded") return "evidence";
  return null;
}
/* one instruction the founder can paste into Claude Code */
function instruction(e){
  var r = recOf(e); return (r ? r.label : actionVerb(e)) + ": " + (e.id || nameOf(e)) + " (" + nameOf(e) + "). Why: " + (r && r.why ? r.why : shortReason(e)) + (tldrOf(e) ? " Result so far: " + tldrOf(e) : "") + " Record the decision in experiments/experiment_log.json.";
}
function copyText(text, btn, boxHost){
  var ok = false;
  try {
    var ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.top = "0"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy"); document.body.removeChild(ta);
  } catch (err) { ok = false; }
  var done = function(){ if (!btn) return; var t = btn.getAttribute("data-label") || btn.textContent; btn.setAttribute("data-label", t); btn.textContent = "Copied"; setTimeout(function(){ btn.textContent = t; }, 1600); };
  var fallback = function(){ if (!boxHost) return; boxHost.innerHTML = '<div class="copybox"><label style="font-size:12px;color:var(--ink-3)">Copy blocked by the browser. Select and copy:</label><textarea readonly>' + esc(text) + '</textarea></div>'; var t = boxHost.querySelector("textarea"); t.focus(); t.select(); };
  if (ok) return done();
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}

/* plain-English verdict sentence for the drawer */
function verdict(e){
  var st = statsOf(e), at = atypeOf(e), r = ruleOf(e), dr = daysRunning(e), t = tlOf(e), plan = planOf(e);
  if (!e.health) return e.lifecycle === "planned" ? "Planned. Not switched on yet." : "Not live.";
  if (e.health === "guardrail_breach") return humanReason(e) + " That outweighs any lift on the primary metric.";
  if (!st || num(st.p_beat) == null) {
    // stuck experiments lead with why they are stuck; the "no numbers" line alone hid it
    if (e.health === "manual_overdue") return humanReason(e);
    if ((e.health === "needs_call" || e.health === "zombie" || e.health === "starved") && at !== "rollout") {
      var l0 = lastResultDate(e);
      return humanReason(e) + (reportingOf(e) === "manual" ? " No numbers: it is reported by hand" + (l0 ? ", last readout " + fd(l0) + "." : " and nothing has been read out.") : "");
    }
    if (at === "rollout") { var gs = guardsOf(e).filter(function(g){ return g.evaluated; }); return "Rollout to everyone, so there is no comparison group. " + (gs.length ? (gs.some(function(g){ return g.breached; }) ? "A guardrail is breached." : "Guardrails are holding (" + gs.length + " checked).") : "Guardrails have not been read yet."); }
    if (reportingOf(e) === "manual") { var l = lastResultDate(e); return "No numbers yet. Reported by hand" + (l ? "; last readout " + fd(l) + "." : ", and nothing has been read out."); }
    if (engineOff(e)) return "No numbers yet: this one is read automatically, and the experiments engine isn't connected, so the readout hasn't run.";
    return readoutOf(e).error ? "No readout: " + readoutOf(e).error + "." : "No readout yet.";
  }
  var p = num(st.p_beat), s = chance(p) + " chance it's better";
